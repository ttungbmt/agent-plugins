apiVersion: agent-plugins/v1
kind: Package
metadata:
  id: acme-skills
  name: Acme Skills
spec:
  publisher: acme
  materialization: collection
  source:
    type: git
    url: https://github.com/acme/skills.git
    ref: main
  discovery:
    strategy: manifest
    manifest: .claude-plugin/plugin.json
  targets:
    - claude-code
  components:
    tdd:
      requires: [codebase-design]
