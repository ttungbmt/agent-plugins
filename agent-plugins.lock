mcpServers:
  - name: firecrawl
    server:
      type: http
      url: https://mcp.firecrawl.dev/v2/mcp
      headers:
        Authorization: Bearer ${FIRECRAWL_API_KEY}
    origin: agent-plugins
  - name: deepwiki
    server:
      type: http
      url: https://mcp.deepwiki.com/mcp
    origin: agent-plugins.preset.yaml
