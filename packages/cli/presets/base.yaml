# yaml-language-server: $schema=../../schemas/schemas/preset.schema.json

kind: Preset

metadata:
  name: base

spec:
  marketplaces:
    claude-plugins-official:
      source: { source: github, repo: anthropics/claude-plugins-official }
      autoUpdate: true
      scope: user

  plugins:
    claude-code-setup@claude-plugins-official: { enabled: true, scope: user }
    claude-md-management@claude-plugins-official: { enabled: true, scope: user }
    commit-commands@claude-plugins-official: { enabled: true, scope: user }
    skill-creator@claude-plugins-official: { enabled: true, scope: user }
    security-guidance@claude-plugins-official: true
    code-simplifier@claude-plugins-official: true
    hookify@claude-plugins-official: true
    typescript-lsp@claude-plugins-official: true

  skills:
    - vercel-labs/skills