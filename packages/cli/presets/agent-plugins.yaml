# yaml-language-server: $schema=../../schemas/schemas/preset.schema.json

kind: Preset

metadata:
  name: agent-plugins

spec:
  extends: base

  marketplaces:
    - mvanhorn/last30days-skill
    - affaan-m/everything-claude-code
    - wshobson/agents
     
  plugins:
    context7@claude-plugins-official: true
    typescript-lsp@claude-plugins-official: true
    mattpocock-skills@claude-plugins-official: true

  skills:
    - source: vercel-labs/agent-skills
      skills: [vercel-composition-patterns, vercel-react-best-practices]

    - source: hmcuongit/cuonghm-ai-workflow-lab
      path: claude/skills
      skills: [jira-worklog-sync]

    - source: github/awesome-copilot
      skills: [documentation-writer]


  agents:
    - source: affaan-m/ECC
      agents: [typescript-reviewer]

    - source: hmcuongit/cuonghm-ai-workflow-lab
      path: claude/agents
      agents: [docs-technical-writer]

  rules:

  hooks:

  mcpServers:
    firecrawl: true
    cloudflare-docs: true
   

  # lspServers: