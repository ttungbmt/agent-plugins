# yaml-language-server: $schema=../../schemas/schemas/preset.schema.json

kind: Preset

metadata:
  name: agent-plugins

spec:
  extends: base

  plugins:
    # --- Anthropic (first-party) ---
    commit-commands@claude-plugins-official: true     # /commit, /commit-push-pr, /clean_gone
    security-guidance@claude-plugins-official: true   # security warnings on edits
    code-simplifier@claude-plugins-official: true     # agent that simplifies recent code
    hookify@claude-plugins-official: true             # build hooks from unwanted behaviour
    typescript-lsp@claude-plugins-official: true      # TypeScript/JS language server

    # --- Upstash ---
    context7@claude-plugins-official: true            # MCP: up-to-date library docs

    # --- Matt Pocock ---
    mattpocock-skills@claude-plugins-official: true   # grilling, spec/ticket flows, TDD, ...



    # - source: hmcuongit/cuonghm-ai-workflow-lab
